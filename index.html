<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bloons TD 5 - Full Screen</title>
    <style>
        /* Remove default spacing and hide scrollbars */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        /* Make the container fill the screen */
        #player-container {
            width: 100vw;
            height: 100vh;
        }
        /* Force Ruffle to stretch to the container boundaries */
        #player-container ruffle-player {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

    <div id="player-container"></div>

    <script src="js/ruffle/ruffle.js"></script>
    
    <script>
        window.addEventListener("DOMContentLoaded", () => {
            const ruffle = window.RufflePlayer.newest();
            const player = ruffle.createPlayer();
            const container = document.getElementById("player-container");
            container.appendChild(player);
            
            player.load({
                url: "btd5.swf", 
                allowScriptAccess: true,
                // Ruffle configurations for scaling
                scale: "showAll", // Scales the game while preserving its native aspect ratio
                quality: "high"
            });
        });
    </script>

</body>
</html>
